{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10">
  <div class="w-full max-w-sm">

    <!-- Icon & title -->
    <div class="text-center mb-6">
      <div
        class="w-14 h-14 bg-slate-800 border-2 border-slate-700 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl float">
        🛡️</div>
      <h1 class="text-xl font-black text-slate-900">Admin Portal</h1>
      <p class="text-slate-500 text-sm mt-1">Secure access for system administrators</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
      <form action="{{ url_for('auth.admin_login') }}" method="POST">

        <!-- Email -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email or Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="email" type="text" placeholder="admin@admin.com or username" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="password" type="password" placeholder="Enter password" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
          class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-900 text-white font-semibold py-2.5 rounded-xl text-sm transition-all hover:-translate-y-0.5 shadow-sm">
          <i class="fas fa-shield-alt text-xs"></i>
          <span id="btn-label">Authenticate</span>
        </button>
      </form>

    </div>

    <div class="text-center mt-5 text-xs text-slate-400">
      <a href="{{ url_for('main.index') }}" class="hover:text-slate-600 transition-colors">
        <i class="fas fa-arrow-left mr-1"></i>Back to Home
      </a>
    </div>
  </div>
</div>
{% endblock %}
