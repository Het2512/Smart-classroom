{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10">
  <div class="w-full max-w-sm">

    <!-- Icon & title -->
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-indigo-50 border-2 border-indigo-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl float">👨‍🏫</div>
      <h1 class="text-xl font-black text-slate-900">Teacher Portal</h1>
      <p class="text-slate-500 text-sm mt-1">Login to your account using credentials from the administrator</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
      <form method="POST">

        <!-- Username -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="email" type="text" placeholder="Enter your username" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="password" type="password" placeholder="Enter password" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <!-- Faculty Code -->
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">
            <i class="fas fa-key text-indigo-400 mr-1"></i> Faculty Secret Code
          </label>
          <div class="relative">
            <i class="fas fa-key absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="code" type="password" placeholder="Faculty secret code" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <!-- Submit -->
        <button id="submit-btn" type="submit"
          class="w-full flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all hover:-translate-y-0.5 shadow-sm">
          <i class="fas fa-sign-in-alt text-xs"></i>
          <span id="btn-label">Login</span>
        </button>
      </form>

      <!-- Info box -->
      <div id="info-login" class="mt-4 flex items-start gap-2 bg-blue-50 border border-blue-100 rounded-xl p-3 text-xs text-blue-700">
        <i class="fas fa-info-circle text-blue-400 mt-0.5 flex-shrink-0"></i>
        <span>Enter the username, password, and faculty code provided to you by the system administrator to log in.</span>
      </div>
    </div>

    <div class="text-center mt-5 text-xs text-slate-400">
      <a href="{{ url_for('main.index') }}" class="hover:text-indigo-600 transition-colors">
        <i class="fas fa-arrow-left mr-1"></i>Back to Home
      </a>
      &nbsp;·&nbsp;
      Student? <a href="{{ url_for('auth.student_login') }}" class="text-emerald-500 font-semibold hover:underline">Login here</a>
    </div>
  </div>
</div>
{% endblock %}
