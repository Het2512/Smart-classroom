{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-10">
  <div class="w-full max-w-sm">

    <!-- Icon -->
    <div class="text-center mb-7">
      <div class="w-14 h-14 bg-emerald-50 border-2 border-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl float">👨‍🎓</div>
      <h1 class="text-xl font-black text-slate-900">Student Login</h1>
      <p class="text-slate-500 text-sm mt-1">Enter your registered email to continue</p>
    </div>

    <!-- Card -->
    <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-7">
      <form method="POST" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email or Username</label>
          <div class="relative">
            <i class="fas fa-user absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="email" type="text" placeholder="your.email@gmail.com or username" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>
        
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1.5">Password</label>
          <div class="relative">
            <i class="fas fa-lock absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-xs"></i>
            <input name="password" type="password" placeholder="••••••••" required
              class="input-focus w-full pl-9 pr-4 py-2.5 text-sm border border-slate-200 rounded-xl bg-slate-50 text-slate-800 placeholder-slate-400 transition-all">
          </div>
        </div>

        <button type="submit"
          class="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-xl text-sm transition-all hover:-translate-y-0.5 shadow-sm">
          <i class="fas fa-arrow-right text-xs"></i> Continue to Dashboard
        </button>
      </form>

      <div class="mt-5 flex items-start gap-2.5 bg-blue-50 border border-blue-100 rounded-xl p-3.5 text-xs text-blue-700">
        <i class="fas fa-info-circle text-blue-400 mt-0.5 flex-shrink-0"></i>
        <span>Only students created by the administrator can log in. Use the credentials emailed to you.</span>
      </div>
    </div>

    <div class="text-center mt-5 text-xs text-slate-400">
      <a href="{{ url_for('main.index') }}" class="hover:text-indigo-600 transition-colors"><i class="fas fa-arrow-left mr-1"></i>Back to Home</a>
      &nbsp;·&nbsp;
      Teacher? <a href="{{ url_for('auth.teacher_login') }}" class="text-indigo-500 font-semibold hover:underline">Login here</a>
    </div>

  </div>
</div>
{% endblock %}
